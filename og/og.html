<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Fonte da imagem de prévia (public/og.jpg, 1200×630). Gerada com o Edge em modo headless. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500&family=JetBrains+Mono:wght@700&family=Unbounded:wght@900&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #08070d; color: #f6f4ff; font-family: Figtree, sans-serif; }
  canvas { position: absolute; inset: 0; }
  .txt { position: absolute; left: 64px; top: 150px; width: 600px; }
  .kicker { font: 700 17px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #e4ff3a; }
  h1 { margin: 22px 0 0; font: 900 132px/.86 Unbounded, sans-serif; letter-spacing: -.045em; text-transform: uppercase; text-shadow: 6px 6px 0 #ff2d8a; }
  p { margin: 30px 0 0; font-size: 30px; line-height: 1.35; font-weight: 500; }
  mark { background: #e4ff3a; color: #08070d; padding: 0 .2em; border-radius: 5px; }
  .faixa { position: absolute; left: -20px; right: -20px; bottom: 26px; transform: rotate(-2deg); background: #e4ff3a; color: #08070d; border-block: 3px solid #08070d; padding: 12px 0; font: 900 22px/1 Unbounded, sans-serif; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
<canvas width="1200" height="630"></canvas>
<div class="txt">
  <div class="kicker">PSR B1919+21 · curiosidades de tecnologia</div>
  <h1>Pulsar</h1>
  <p>A história por trás do que você usa todo dia, <mark>sempre com fonte</mark>.</p>
</div>
<div class="faixa">LED azul ✦ primeiro bug ✦ código de barras ✦ GPS e Einstein ✦ o primeiro site ✦ por que @ ✦ o primeiro pulsar ✦ LED azul ✦ primeiro bug</div>
<script>
  // mesmo desenho do topo do site, com sorteio fixo para a imagem sair sempre igual
  var semente = 7;
  function sorte() { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; }
  var c = document.querySelector("canvas").getContext("2d");
  for (var i = 0; i < 140; i++) {
    c.globalAlpha = .2 + sorte() * .5;
    c.fillStyle = "#fff";
    c.fillRect(sorte() * 1200, sorte() * 630, sorte() * 1.4 + .4, sorte() * 1.4 + .4);
  }
  c.globalAlpha = 1;
  var ex = 967, ey = 128;
  c.globalCompositeOperation = "lighter";
  [2.05, 2.05 + Math.PI].forEach(function (a) {
    var g = c.createRadialGradient(ex, ey, 0, ex, ey, 900);
    g.addColorStop(0, "rgba(228,255,58,.34)");
    g.addColorStop(.3, "rgba(228,255,58,.08)");
    g.addColorStop(1, "rgba(228,255,58,0)");
    c.fillStyle = g;
    [.07, .012].forEach(function (w) {
      c.beginPath(); c.moveTo(ex, ey); c.arc(ex, ey, 900, a - w, a + w); c.closePath(); c.fill();
    });
  });
  c.globalCompositeOperation = "source-over";
  var halo = c.createRadialGradient(ex, ey, 0, ex, ey, 110);
  halo.addColorStop(0, "rgba(228,255,58,.7)");
  halo.addColorStop(.22, "rgba(255,45,138,.2)");
  halo.addColorStop(1, "rgba(255,45,138,0)");
  c.fillStyle = halo; c.beginPath(); c.arc(ex, ey, 110, 0, 7); c.fill();
  c.fillStyle = "#fbffe2"; c.beginPath(); c.arc(ex, ey, 8, 0, 7); c.fill();

  var N = 20, P = 140, x0 = 750, x1 = 1185, topo = 230, base = 540, passo = (base - topo) / (N - 1);
  var grad = c.createLinearGradient(x0, 0, x1, 0);
  grad.addColorStop(0, "rgba(228,255,58,0)"); grad.addColorStop(.14, "#e4ff3a"); grad.addColorStop(.86, "#e4ff3a"); grad.addColorStop(1, "rgba(228,255,58,0)");
  for (var k = 0; k < N; k++) {
    var meio = .5 + (sorte() - .5) * .03, amp = .35 + sorte() * .65, larg = .022 + sorte() * .014, ruido = 0, pts = [];
    var subs = []; for (var s = Math.floor(sorte() * 3); s > 0; s--) subs.push([meio + (sorte() - .5) * .09, amp * (.25 + sorte() * .5), .008 + sorte() * .012]);
    for (var j = 0; j <= P; j++) {
      var x = j / P, d = (x - meio) / larg, perto = .25 + .75 * Math.exp(-Math.pow((x - meio) / .22, 2));
      ruido = ruido * .55 + (sorte() - .5) * .09;
      var v = amp * Math.exp(-d * d) + ruido * perto;
      subs.forEach(function (q) { var d2 = (x - q[0]) / q[2]; v += q[1] * Math.exp(-d2 * d2); });
      pts.push(v);
    }
    var y = topo + k * passo, alto = passo * 5, alfa = .12 + .88 * Math.pow(k / (N - 1), 1.3);
    function linha(dx, dy) { c.beginPath(); pts.forEach(function (v, j) { var px = x0 + dx + j / P * (x1 - x0), py = y + dy - v * alto; if (j) c.lineTo(px, py); else c.moveTo(px, py); }); }
    linha(0, 0); c.lineTo(x1, y + passo); c.lineTo(x0, y + passo); c.closePath(); c.fillStyle = "#08070d"; c.fill();
    if (k === N - 1) { c.globalAlpha = 1; c.strokeStyle = "#ff2d8a"; c.lineWidth = 2.6; linha(3, 3); c.stroke(); }
    c.globalAlpha = alfa; c.strokeStyle = grad; c.lineWidth = k === N - 1 ? 2.4 : 1.6; linha(0, 0); c.stroke(); c.globalAlpha = 1;
  }
</script>
</body>
</html>
